<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me dá um real?</title>
  <style>
    button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px #2E7D32;
      transition: all 0.05s ease; 
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px #2E7D32;
    }

    #btn-easter {
      background-color: #9c27b0;
      box-shadow: 0 6px #7b1fa2;
      margin-top: 20px;
      display: block;
    }
    #btn-easter:active {
      box-shadow: 0 2px #7b1fa2;
    }
  </style>
</head>
<body>

  <h2>me da um real? eu agradeço, meu pix é lghadoido@gmail.com</h2>

  <ul>
    <li><button id="btn-nao">não</button></li><br><br>
    <li><button id="btn-sim">sim</button></li><br><br>
    <li><button id="btn-caro">tá muito caro</button></li><br><br>
  </ul>

  <div id="container-secreto"></div>

  <h3 id="mensagem"></h3>
  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
  <h6>NÃO CLIQUE DUAS VEZES NA TELA</h6>

  <script>
    const btnSim = document.getElementById('btn-sim');
    const btnNao = document.getElementById('btn-nao');
    const btnCaro = document.getElementById('btn-caro');
    const mensagem = document.getElementById('mensagem');
    const containerSecreto = document.getElementById('container-secreto');

    let easterCriado = false;

    document.addEventListener('dblclick', function() {
      if (!easterCriado) {
        easterCriado = true;

        const btnEaster = document.createElement('button');
        btnEaster.id = 'btn-easter';
        btnEaster.textContent = 'easter egg';

        containerSecreto.appendChild(btnEaster);

        mensagem.textContent = '👀 Opa! Você achou um segredo... Clica nele aí!';

        btnEaster.addEventListener('click', function() {
          mensagem.textContent = 'Você conseguiu achar o easter egg, agora é obrigado fazer o pix! 💸🔫😂';
        });
      }
    });

    btnSim.addEventListener('click', function() {
      mensagem.textContent = 'Obrigado! TMJ! 🤑🙏🎉';

      setTimeout(function() {
        mensagem.textContent = 'E o pix? Nada ainda? 🤨📉';
      }, 60000);
    });

    btnNao.addEventListener('click', function() {
      mensagem.textContent = 'Porra man, mas beleza...';
    });

    btnCaro.addEventListener('click', function() {
      mensagem.textContent = 'Faz o L HAHAHAHAHAHAHAHAHAHAHAHAHAHHAAHHA';
    });
  </script>
</body>
</html>
